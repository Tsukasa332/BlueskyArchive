[project]
name = "blueskyarchive"
version = "0.1.0"
description = "Shared dependency environment for the BlueskyArchive backend and fetcher"
authors = [{ name = "HAYASHI Tsukasa" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
backend = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.7",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
    "tzdata==2026.6",
    "uvicorn[standard]==0.54.0",
]
fetcher = [
    "httpx==0.28.1",
    "psycopg[binary]==3.3.7",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
]
dev = [
    { include-group = "backend" },
    { include-group = "fetcher" },
    "pytest==9.2.0",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false
default-groups = ["dev"]
required-version = ">=0.13.7"
