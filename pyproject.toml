[project]
name = "blueskyarchive"
version = "0.1.0"
description = "Shared dependency environment for the BlueskyArchive backend and fetcher"
authors = [{ name = "HAYASHI Tsukasa" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
backend = [
    "alembic==1.14.0",
    "fastapi==0.115.6",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "tzdata==2026.3",
    "uvicorn[standard]==0.34.0",
]
fetcher = [
    "httpx==0.28.1",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
]
dev = [
    { include-group = "backend" },
    { include-group = "fetcher" },
    "pytest==8.3.4",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false
default-groups = ["dev"]
